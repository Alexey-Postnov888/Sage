spring:
  application:
    name: ContentService
  datasource:
    url: jdbc:postgresql://${POSTGRES_CONTENT_HOST}:5432/${POSTGRES_CONTENT_DB}
    username: ${POSTGRES_CONTENT_USER}
    password: ${POSTGRES_CONTENT_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validateOnMigrate: true
  seaweedfs:
    s3:
      endpoint: ${S3_ENDPOINT}
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
      region: ${AWS_REGION}
      bucket: ${S3_BUCKET}
      path-style-access: true