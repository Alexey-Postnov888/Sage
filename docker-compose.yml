services:
  postgres_content:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_CONTENT_DB}
      POSTGRES_USER: ${POSTGRES_CONTENT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CONTENT_PASSWORD}
    volumes:
      - content_data:/var/lib/postgresql/18/docker
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    container_name: seaweedfs
    command:
      - mini
      - -dir=/data
      - -s3.externalUrl=http://localhost:8333
      - -master.telemetry=false
      - -admin.password=${AWS_ADMIN_PASSWORD}
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
    ports:
      - "8333:8333"     # S3 API
      - "12535:12535"   # Admin UI
    volumes:
      - seaweedfs-data:/data
    restart: unless-stopped

  content-service:
    build: ./ContentService
    environment:
      POSTGRES_CONTENT_HOST: postgres_content
      POSTGRES_CONTENT_DB: ${POSTGRES_CONTENT_DB}
      POSTGRES_CONTENT_USER: ${POSTGRES_CONTENT_USER}
      POSTGRES_CONTENT_PASSWORD: ${POSTGRES_CONTENT_PASSWORD}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
    ports:
      - "8087:8080"
      - "9097:9090"
    depends_on:
      - postgres_content
      - seaweedfs
    restart: unless-stopped

volumes:
  content_data:
  seaweedfs-data: