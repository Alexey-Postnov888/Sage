services:
  postgres-registry:
    image: postgres:18
    env_file: RegistryService/env/.env
    ports:
      - "5455:5432"
    volumes:
      - postgres_registry_data:/var/lib/postgresql
    restart: unless-stopped

  registry-service:
    build: ./RegistryService
    ports:
      - "8085:8080"
    env_file:
      - RegistryService/env/.env.docker
      - RegistryService/env/.env
    environment:
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      - postgres-registry
    restart: unless-stopped

  summary-service:
    build: ./SummaryService
    ports:
      - "8084:8080"
    environment:
      - YANDEX_FOLDER=${YANDEX_FOLDER}
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_MODEL=${YANDEX_MODEL}
    restart: unless-stopped

  voice-service:
    build: ./VoiceService
    ports:
      - "8086:8000"
    volumes:
      - ./whisper_cache:/root/.cache/huggingface/hub
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - summary-service
      - voice-service

volumes:
  postgres_registry_data: